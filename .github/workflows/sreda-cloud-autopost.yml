name: SREDA Cloud Autopost

on:
  workflow_dispatch:
    inputs:
      story_slot:
        description: Verify, or publish one exact approved 1 September V2 frame
        required: true
        default: verify
        type: choice
        options:
          - verify
          - "15:20"
          - "15:40"
          - "16:00"
          - "16:20"
          - "16:40"

concurrency:
  # Verify never blocks live work. Every approved frame has its own exact slot;
  # their non-overlapping +15m windows preserve sequence order.
  group: >-
    sreda-cloud-autopost-${{
      inputs.story_slot == '15:20' && 'story-1520' ||
      inputs.story_slot == '15:40' && 'story-1540' ||
      inputs.story_slot == '16:00' && 'story-1600' ||
      inputs.story_slot == '16:20' && 'story-1620' ||
      inputs.story_slot == '16:40' && 'story-1640' ||
      inputs.story_slot == 'verify' && 'verify' || 'unknown'
    }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.story_slot == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: tools/sreda-instagram-publisher
        run: npm ci
      - name: Decrypt exact approved Story release for QA
        env:
          SREDA_STORIES_ASSETS_PASSWORD: ${{ secrets.SREDA_STORIES_ASSETS_PASSWORD }}
        run: |
          mkdir -p current/stories-bank /tmp/sreda-content
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in content/stories-2026-09-01-v2.tar.gz.enc \
            -out /tmp/sreda-content/stories.tar.gz \
            -pass env:SREDA_STORIES_ASSETS_PASSWORD
          tar -xzf /tmp/sreda-content/stories.tar.gz -C current/stories-bank
      - name: Verify exact approved Story hashes
        working-directory: current/stories-bank
        run: |
          sha256sum -c <<'EOF'
          997b387c3df3d9a951f3d1ffbd4ce4a31558021dd3f882dac3bdac0a553bc80b  2026-09-01-v2/01-information-guest.png
          76d6e04e93730592a32d25bd9fd41b286114f310ec13908880f6d0a7f26ec7fb  2026-09-01-v2/02-air-balloons.png
          dfc7d5fbb38670872a125321ae14de1f9dde493278084e8bb7e0ca07516be07c  2026-09-01-v2/03-live-editorial.png
          9d0baca16a64eab419d951ec127f9090109ec3b4b19b6f9658b78190da632402  2026-09-01-v2/04-air-ivory.png
          b29199b3177e26bd77a82841fec1924cf5cf6d52263479448fa54ec0932639c0  2026-09-01-v2/05-information-omelette.png
          EOF
      - name: Verify publisher code while Stories are paused
        working-directory: tools/sreda-instagram-publisher
        env:
          SREDA_STORIES_ROOT: ${{ github.workspace }}/current/stories-bank
        run: npm test
      - name: Install cloudflared
        run: |
          mkdir -p .bin
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o .bin/cloudflared
          chmod +x .bin/cloudflared
      - name: Verify Meta accounts and public staging
        working-directory: tools/sreda-instagram-publisher
        env:
          SREDA_IG_ACCESS_TOKEN: ${{ secrets.SREDA_IG_ACCESS_TOKEN }}
          SREDA_IG_USER_ID: ${{ secrets.SREDA_IG_USER_ID }}
          SREDA_THREADS_ACCESS_TOKEN: ${{ secrets.SREDA_THREADS_ACCESS_TOKEN }}
          SREDA_THREADS_USERNAME: ${{ secrets.SREDA_THREADS_USERNAME }}
          SREDA_CLOUDFLARED: ${{ github.workspace }}/.bin/cloudflared
        run: node src/cloud-verify.mjs

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.story_slot != 'verify' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: tools/sreda-instagram-publisher
        run: npm ci
      - name: Install cloudflared
        run: |
          mkdir -p .bin
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o .bin/cloudflared
          chmod +x .bin/cloudflared
      - name: Decrypt approved media
        env:
          SREDA_STORIES_ASSETS_PASSWORD: ${{ secrets.SREDA_STORIES_ASSETS_PASSWORD }}
        run: |
          mkdir -p current/stories-bank /tmp/sreda-content
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in content/stories-2026-09-01-v2.tar.gz.enc \
            -out /tmp/sreda-content/stories.tar.gz \
            -pass env:SREDA_STORIES_ASSETS_PASSWORD
          tar -xzf /tmp/sreda-content/stories.tar.gz -C current/stories-bank
      - name: Resolve and await exact local slot
        id: slot
        shell: bash
        run: |
          trigger="${{ inputs.story_slot }}"
          case "$trigger" in
            "15:20") slot="15:20"; target="10:20" ;;
            "15:40") slot="15:40"; target="10:40" ;;
            "16:00") slot="16:00"; target="11:00" ;;
            "16:20") slot="16:20"; target="11:20" ;;
            "16:40") slot="16:40"; target="11:40" ;;
            *) exit 2 ;;
          esac
          target_epoch="$(date -u -d "$(date -u +%F) $target:00" +%s)"
          now_epoch="$(date -u +%s)"
          wait_seconds="$((target_epoch - now_epoch))"
          if (( wait_seconds > 0 )); then
            echo "Prewarmed; waiting ${wait_seconds}s for $slot Asia/Qyzylorda"
            sleep "$wait_seconds"
          elif (( -wait_seconds > 900 )); then
            echo "Refusing a stale Story slot: $((-wait_seconds))s late" >&2
            exit 3
          fi
          local_date="$(TZ=Asia/Qyzylorda date +%F)"
          if [[ "$local_date" != "2026-09-01" ]]; then
            echo "This one-time Story release is valid only on 2026-09-01" >&2
            exit 4
          fi
          echo "time=$slot" >> "$GITHUB_OUTPUT"
          echo "ledger_key=sreda-story-${local_date}-${slot//:/}" >> "$GITHUB_OUTPUT"
      - name: Restore durable publication ledger
        id: story_ledger
        uses: actions/cache/restore@v4
        with:
          path: tools/sreda-instagram-publisher/.runtime/publication-ledger.json
          key: ${{ steps.slot.outputs.ledger_key }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.slot.outputs.ledger_key }}-
      - name: Prepare exact approved Story container
        id: prepare_story
        working-directory: tools/sreda-instagram-publisher
        env:
          SREDA_IG_ACCESS_TOKEN: ${{ secrets.SREDA_IG_ACCESS_TOKEN }}
          SREDA_IG_USER_ID: ${{ secrets.SREDA_IG_USER_ID }}
          SREDA_IG_USERNAME: sreda.astana
          SREDA_THREADS_AUTOPUBLISH_ENABLED: "false"
          SREDA_CLOUDFLARED: ${{ github.workspace }}/.bin/cloudflared
          SREDA_STORIES_ROOT: ${{ github.workspace }}/current/stories-bank
        run: >-
          node src/schedule-runner.mjs
          --scheduled-local-time "${{ steps.slot.outputs.time }}"
          --story-phase prepare
      - name: Save prepared Story checkpoint
        id: prepared_checkpoint
        if: steps.prepare_story.outputs.needs_publish == 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/sreda-instagram-publisher/.runtime/publication-ledger.json
          key: ${{ steps.slot.outputs.ledger_key }}-${{ github.run_id }}-prepared
      - name: Reserve one durable media_publish attempt
        id: reserve_story
        if: steps.prepare_story.outputs.needs_publish == 'true'
        working-directory: tools/sreda-instagram-publisher
        env:
          SREDA_STORIES_ROOT: ${{ github.workspace }}/current/stories-bank
        run: >-
          node src/schedule-runner.mjs
          --scheduled-local-time "${{ steps.slot.outputs.time }}"
          --story-phase reserve
          --reservation-id "${{ github.run_id }}"
      - name: Save durable pre-publish reservation
        id: reservation_checkpoint
        if: steps.prepare_story.outputs.needs_publish == 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/sreda-instagram-publisher/.runtime/publication-ledger.json
          key: ${{ steps.slot.outputs.ledger_key }}-${{ github.run_id }}-reserved
      - name: Publish only the durably reserved Story
        id: publish_story
        if: steps.prepare_story.outputs.needs_publish == 'true'
        working-directory: tools/sreda-instagram-publisher
        env:
          SREDA_IG_ACCESS_TOKEN: ${{ secrets.SREDA_IG_ACCESS_TOKEN }}
          SREDA_IG_USER_ID: ${{ secrets.SREDA_IG_USER_ID }}
          SREDA_IG_USERNAME: sreda.astana
          SREDA_THREADS_AUTOPUBLISH_ENABLED: "false"
          SREDA_STORIES_ROOT: ${{ github.workspace }}/current/stories-bank
        run: >-
          node src/schedule-runner.mjs
          --scheduled-local-time "${{ steps.slot.outputs.time }}"
          --story-phase publish
          --reservation-id "${{ github.run_id }}"
      - name: Save final or uncertain Story state
        if: >-
          always() &&
          steps.prepare_story.outputs.needs_publish == 'true' &&
          steps.reservation_checkpoint.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: tools/sreda-instagram-publisher/.runtime/publication-ledger.json
          key: ${{ steps.slot.outputs.ledger_key }}-${{ github.run_id }}-final
